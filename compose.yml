services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: order_inventory
      POSTGRES_USER: order_app
      POSTGRES_PASSWORD: order_app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_app -d order_inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  application:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://database:5432/order_inventory
      DB_USERNAME: order_app
      DB_PASSWORD: order_app
      DB_POOL_SIZE: 16
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
