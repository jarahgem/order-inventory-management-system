services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: order_inventory
      POSTGRES_USER: order_app
      POSTGRES_PASSWORD: order_app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_app -d order_inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  application:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://database:5432/order_inventory
      DB_USERNAME: order_app
      DB_PASSWORD: order_app
      DB_POOL_SIZE: 16
      PAYMENT_PROCESSING_LEASE: 30s
      # Local demo credentials only. BCrypt hashes for "local-admin-password" /
      # "local-client-password". Replace with deployment-managed secrets in real environments.
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: '$$2b$$10$$etygHLfZ5QGpyCl1TKSjSO2h9Q2gVvNw2MU4EwHtJRmfTQ52o5d..'
      CLIENT_USERNAME: client
      CLIENT_PASSWORD: '$$2b$$10$$K47OY2NGbhQ7rewUMfZ9VOUS7wQ9FG1PKK2z5NYWF4lis4r/Pz6Oq'
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
