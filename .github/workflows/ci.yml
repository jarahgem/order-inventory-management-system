name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21 and Gradle cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Bootstrap checksum-verified Gradle Wrapper
        run: ./gradlew --version

      - name: Validate the official Gradle Wrapper JAR
        uses: gradle/actions/wrapper-validation@v6

      - name: Verify application and JavaDoc
        run: ./gradlew --no-daemon clean build javadoc

      - name: Upload test, coverage, and JavaDoc reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            build/test-results/test
            build/reports/tests/test
            build/reports/jacoco/test
            build/docs/javadoc
          if-no-files-found: ignore
          retention-days: 7
