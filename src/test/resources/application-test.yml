spring:
  datasource:
    url: jdbc:h2:mem:order_inventory_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=15000
    username: sa
    password:
    hikari:
      maximum-pool-size: 32
      minimum-idle: 4
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

logging:
  level:
    root: WARN
    com.megharaj.orderinventory: INFO
