spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  security:
    users:
      - username: ${ADMIN_USERNAME}
        password: ${ADMIN_PASSWORD}
        roles:
          - ADMIN
      - username: ${CLIENT_USERNAME}
        password: ${CLIENT_PASSWORD}
        roles:
          - ORDER_CLIENT
